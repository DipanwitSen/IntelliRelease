# Local development profile: in-memory H2, verbose SQL, no external dependencies.
# Everything except PostgreSQL, MailHog and Ollama runs without a container.
spring:
  jpa:
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

management:
  health:
    mail:
      # MailHog is explicitly optional in dev (see comment above): its absence
      # should not flip the whole /actuator/health aggregate to DOWN.
      enabled: false

logging:
  level:
    com.gyansys.intellirelease: DEBUG
    org.hibernate.SQL: DEBUG
