# Local development profile: in-memory H2, verbose SQL, no external dependencies.
# Everything except PostgreSQL, MailHog and Ollama runs without a container.
spring:
  jpa:
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

intellirelease:
  github:
    # Empty secret => webhook HMAC verification runs in "unsigned demo" mode and
    # the event is persisted with signature_valid = false. The pipeline still runs,
    # but the UI labels the event as unverified. Never do this outside the POC.
    webhook-secret: ""

logging:
  level:
    com.gyansys.intellirelease: DEBUG
    org.hibernate.SQL: DEBUG
